[pytest]
# Register the project base folder onto the system path mappings
pythonpath = .

# Standardize default arguments (Notice: --alluredir has been removed)
addopts = -vs

markers =
    ui: Marks tests evaluating UI features via Playwright browser contexts
    api: Marks tests evaluating backend REST HTTP requests via Playwright APIRequestContext
    auth: Marks tests handling state storage generation and authentication matrices
    integration: Marks end-to-end hybrid workflows connecting APIs directly with UI elements
