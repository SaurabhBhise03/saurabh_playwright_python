name: Playwright Test Execution

# Controls when the workflow will run
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows you to manually trigger the execution from GitHub UI

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Matches your environment

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ensure Playwright is installed
      run: pip install playwright

    - name: Install Playwright Browsers with Dependencies
      run: playwright install --with-deps

    - name: Run Playwright tests
      run: pytest # Or your custom execution command like 'python parallel_runner.py'

    - name: Upload Test Reports
      uses: actions/upload-artifact@v4
      if: always() # Ensures reports upload even if tests fail
      with:
        name: playwright-execution-report
        path: reports/
        retention-days: 30
